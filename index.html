<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Value Coin - Login & Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f7ff;
    color:#172554;
}

/* HEADER */

header{
    background:#061b55;
    padding:16px 20px;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:white;
    font-size:27px;
    font-weight:bold;
    text-decoration:none;
}

.logo span{
    color:#ffd21c;
}

.home-btn{
    color:white;
    border:1px solid white;
    padding:9px 17px;
    border-radius:25px;
    text-decoration:none;
    font-weight:bold;
}

/* MAIN */

.main{
    min-height:calc(100vh - 150px);
    padding:50px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(135deg,#06266d,#0877dc,#00a9e8);
}

/* AUTH BOX */

.auth-box{
    width:100%;
    max-width:440px;
    background:white;
    border-radius:25px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.22);
}

/* LOGO */

.auth-logo{
    width:75px;
    height:75px;
    margin:0 auto 15px;
    border-radius:50%;
    background:linear-gradient(145deg,#ffe35b,#e39a08);
    border:5px solid #fff1a0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#5b3300;
    font-size:24px;
    font-weight:bold;
}

/* TITLES */

.auth-box h1{
    text-align:center;
    font-size:29px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
    font-size:14px;
}

/* TABS */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#eef3ff;
    padding:5px;
    border-radius:30px;
    margin-bottom:25px;
}

.tab{
    border:none;
    background:transparent;
    padding:12px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
    color:#64748b;
    font-size:15px;
}

.tab.active{
    background:#0866d9;
    color:white;
}

/* FORM */

.form{
    display:none;
}

.form.active{
    display:block;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:14px 15px;
    border:1px solid #d8e0f0;
    border-radius:12px;
    outline:none;
    font-size:15px;
    background:#fafcff;
}

.field input:focus{
    border-color:#0877dc;
    box-shadow:0 0 0 3px rgba(8,119,220,.10);
}

/* PASSWORD */

.password-box{
    position:relative;
}

.password-box input{
    padding-right:70px;
}

.show-password{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    color:#0866d9;
    cursor:pointer;
    font-weight:bold;
}

/* CHECKBOX */

.check{
    display:flex;
    gap:8px;
    align-items:flex-start;
    margin:12px 0 20px;
    font-size:13px;
    color:#64748b;
}

.check input{
    margin-top:3px;
}

/* BUTTON */

.submit-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:30px;
    background:#ffd21c;
    color:#071b50;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:hover{
    opacity:.9;
}

/* FORGOT */

.forgot{
    display:block;
    text-align:right;
    margin-top:-7px;
    margin-bottom:20px;
    color:#0866d9;
    font-size:13px;
    cursor:pointer;
}

/* DIVIDER */

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:25px 0;
    color:#94a3b8;
    font-size:12px;
}

.divider:before,
.divider:after{
    content:"";
    height:1px;
    background:#e2e8f0;
    flex:1;
}

/* SECURITY */

.security{
    background:#f0fdf4;
    border:1px solid #bbf7d0;
    color:#166534;
    padding:12px;
    border-radius:12px;
    font-size:12px;
    text-align:center;
}

/* FOOTER */

footer{
    background:#071533;
    color:white;
    text-align:center;
    padding:25px 15px;
}

footer p{
    color:#b8c3dc;
    font-size:12px;
    margin-top:5px;
}

/* SUCCESS MESSAGE */

.message{
    display:none;
    margin-bottom:18px;
    padding:12px;
    border-radius:10px;
    background:#eff6ff;
    color:#1d4ed8;
    font-size:13px;
    text-align:center;
}

.message.show{
    display:block;
}

/* MOBILE */

@media(max-width:500px){

    .main{
        padding:30px 15px;
        align-items:flex-start;
    }

    .auth-box{
        padding:25px 20px;
        margin-top:10px;
    }

    .auth-box h1{
        font-size:25px;
    }

    .logo{
        font-size:23px;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header>

<div class="nav">

<a href="#" class="logo">
Value <span>Coin</span>
</a>

<a href="#" class="home-btn">
← Home
</a>

</div>

</header>


<!-- MAIN -->

<main class="main">

<div class="auth-box">


<div class="auth-logo">
VC
</div>


<h1>
Welcome to Value Coin
</h1>

<p class="subtitle">
আপনার অ্যাকাউন্টে প্রবেশ করুন অথবা নতুন অ্যাকাউন্ট তৈরি করুন
</p>


<!-- TABS -->

<div class="tabs">

<button
class="tab active"
id="loginTab"
onclick="showLogin()"
>
Login
</button>

<button
class="tab"
id="registerTab"
onclick="showRegister()"
>
Register
</button>

</div>


<!-- MESSAGE -->

<div class="message" id="message">
Demo action completed.
</div>


<!-- LOGIN FORM -->

<form
class="form active"
id="loginForm"
onsubmit="demoLogin(event)"
>

<div class="field">

<label>
Email / Mobile Number
</label>

<input
type="text"
placeholder="আপনার Email অথবা Mobile Number"
required
>

</div>


<div class="field">

<label>
Password
</label>

<div class="password-box">

<input
type="password"
id="loginPassword"
placeholder="আপনার Password"
required
>

<button
type="button"
class="show-password"
onclick="togglePassword('loginPassword',this)"
>
Show
</button>

</div>

</div>


<span
class="forgot"
onclick="forgotPassword()"
>
Forgot Password?
</span>


<button
type="submit"
class="submit-btn"
>
Login →
</button>


</form>


<!-- REGISTER FORM -->

<form
class="form"
id="registerForm"
onsubmit="demoRegister(event)"
>


<div class="field">

<label>
Full Name
</label>

<input
type="text"
placeholder="আপনার পূর্ণ নাম"
required
>

</div>


<div class="field">

<label>
Mobile Number
</label>

<input
type="tel"
placeholder="01XXXXXXXXX"
required
>

</div>


<div class="field">

<label>
Email Address
</label>

<input
type="email"
placeholder="example@gmail.com"
required
>

</div>


<div class="field">

<label>
Password
</label>

<div class="password-box">

<input
type="password"
id="registerPassword"
placeholder="কমপক্ষে 8 characters"
required
minlength="8"
>

<button
type="button"
class="show-password"
onclick="togglePassword('registerPassword',this)"
>
Show
</button>

</div>

</div>


<div class="field">

<label>
Confirm Password
</label>

<div class="password-box">

<input
type="password"
id="confirmPassword"
placeholder="Password আবার লিখুন"
required
>

<button
type="button"
class="show-password"
onclick="togglePassword('confirmPassword',this)"
>
Show
</button>

</div>

</div>


<label class="check">

<input
type="checkbox"
required
>

<span>
আমি Value Coin-এর Terms & Conditions এবং Privacy Policy পড়েছি ও সম্মত।
</span>

</label>


<button
type="submit"
class="submit-btn"
>
Create Account →
</button>


</form>


<div class="divider">
SECURE DEMO ACCESS
</div>


<div class="security">
🔒 আপনার তথ্যের নিরাপত্তা আমাদের অগ্রাধিকার
</div>


</div>

</main>


<!-- FOOTER -->

<footer>

<h3>
Value Coin
</h3>

<p>
© 2026 Value Coin. All rights reserved.
</p>

</footer>



<script>

/* SHOW LOGIN */

function showLogin(){

    document.getElementById("loginForm")
    .classList.add("active");

    document.getElementById("registerForm")
    .classList.remove("active");

    document.getElementById("loginTab")
    .classList.add("active");

    document.getElementById("registerTab")
    .classList.remove("active");

    hideMessage();
}


/* SHOW REGISTER */

function showRegister(){

    document.getElementById("registerForm")
    .classList.add("active");

    document.getElementById("loginForm")
    .classList.remove("active");

    document.getElementById("registerTab")
    .classList.add("active");

    document.getElementById("loginTab")
    .classList.remove("active");

    hideMessage();
}


/* PASSWORD */

function togglePassword(id,button){

    const input =
    document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        button.innerText = "Hide";

    }else{

        input.type = "password";

        button.innerText = "Show";

    }

}


/* LOGIN DEMO */

function demoLogin(event){

    event.preventDefault();

    const message =
    document.getElementById("message");

    message.innerText =
    "Demo Login সফল হয়েছে। বাস্তব Login চালুর জন্য backend প্রয়োজন।";

    message.classList.add("show");

}


/* REGISTER DEMO */

function demoRegister(event){

    event.preventDefault();

    const password =
    document.getElementById("registerPassword").value;

    const confirm =
    document.getElementById("confirmPassword").value;

    if(password !== confirm){

        alert("Password এবং Confirm Password একই নয়।");

        return;

    }

    const message =
    document.getElementById("message");

    message.innerText =
    "Demo Registration সফল হয়েছে। বাস্তব account তৈরি করতে backend প্রয়োজন।";

    message.classList.add("show");

}


/* FORGOT PASSWORD */

function forgotPassword(){

    alert(
        "Demo Version: Password recovery চালুর জন্য backend/email system প্রয়োজন।"
    );

}


/* HIDE MESSAGE */

function hideMessage(){

    document
    .getElementById("message")
    .classList.remove("show");

}

</script>


</body>
</html>
